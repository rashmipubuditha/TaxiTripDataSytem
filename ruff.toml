# Lint settings used for this project (optional tool: pip install ruff && ruff check .)
line-length = 120
target-version = "py310"
extend-exclude = [".venv", ".prefect", "Dataset_*", "data", "logs"]

[lint]
# pycodestyle, pyflakes, warnings, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
